<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff9f5">
  <title>Quiz 마을 | Copilot Agent 퀴즈</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #252238;
      --muted: #77738b;
      --paper: #fffefd;
      --line: #e9e3ef;
      --pink: #f7a9c5;
      --pink-pale: #fff0f5;
      --orange: #ffc98c;
      --orange-pale: #fff5e8;
      --mint: #a9ddbd;
      --mint-pale: #effaf2;
      --blue: #a9cafa;
      --blue-pale: #f0f6ff;
      --violet: #6845c5;
      --violet-dark: #4b2da3;
      --shadow: 0 18px 48px rgba(58, 46, 99, .10);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      color: var(--ink);
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      background:
        radial-gradient(ellipse at 8% 12%, rgba(255, 220, 216, .62), transparent 34rem),
        radial-gradient(ellipse at 94% 82%, rgba(199, 241, 229, .72), transparent 37rem),
        linear-gradient(135deg, #fff8f1 0%, #f5f3ff 52%, #eef9f4 100%);
    }
    button, input { font: inherit; }
    button { color: inherit; }
    a { color: inherit; }
    .topbar {
      min-height: 74px;
      padding: 0 clamp(18px, 5vw, 72px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      background: rgba(255, 255, 255, .86);
      border-bottom: 1px solid rgba(226, 218, 234, .72);
      backdrop-filter: blur(12px);
    }
    .brand { display: flex; align-items: center; gap: 11px; min-width: 180px; }
    .brand-mark {
      width: 40px; height: 40px; display: grid; place-items: center;
      border-radius: 13px; background: linear-gradient(145deg, #ffd8c7, #e6e3ff);
      font-size: 22px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.7);
    }
    .brand-name { font-weight: 850; font-size: 16px; }
    .brand-caption { color: var(--muted); font-size: 11px; margin-top: 3px; }
    .nav { display: flex; align-items: center; gap: 7px; }
    .nav button {
      border: 0; background: transparent; padding: 10px 14px; border-radius: 999px;
      color: #635d76; font-size: 13px; font-weight: 750; cursor: pointer;
    }
    .nav button:hover { background: #f6f1fb; }
    .nav button.active { color: white; background: #3640a6; box-shadow: 0 5px 13px rgba(54,64,166,.18); }
    .page { width: min(1120px, calc(100% - 36px)); margin: 42px auto 70px; }
    .page.home-mode {
      min-height: calc(100vh - 136px); margin-block: 0; padding-block: 32px;
      display: grid; place-items: center;
    }
    .local-note {
      display: flex; align-items: flex-start; gap: 10px; padding: 12px 15px;
      margin-bottom: 20px; color: #645875; background: rgba(255,255,255,.76);
      border: 1px solid rgba(228, 219, 239, .9); border-radius: 12px; font-size: 12px; line-height: 1.65;
    }
    .local-note strong { color: var(--violet-dark); white-space: nowrap; }
    .panel {
      position: relative; background: rgba(255,255,255,.9); border: 1px solid rgba(255,255,255,.92);
      border-radius: 24px; box-shadow: var(--shadow);
    }
    .panel-rainbow::before {
      content: ""; position: absolute; inset: -2px; z-index: -1; border-radius: 26px;
      background: linear-gradient(125deg, #ffaec7, #ffd489 38%, #a8dfb5 70%, #b4a1ff);
    }
    .plaza-grid { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(320px, .8fr); gap: 22px; }
    .welcome { min-height: 430px; padding: clamp(26px, 4vw, 48px); overflow: hidden; }
    .welcome::after {
      content: "🏠"; position: absolute; right: 34px; bottom: 26px; font-size: clamp(76px, 10vw, 126px);
      opacity: .14; transform: rotate(-8deg); pointer-events: none;
    }
    .eyebrow, .tag {
      display: inline-flex; align-items: center; gap: 7px; width: fit-content;
      padding: 7px 12px; border-radius: 999px; background: var(--pink-pale); color: #a63261;
      font-size: 12px; font-weight: 850;
    }
    h1, h2, h3, p { margin-top: 0; }
    .welcome h1 { max-width: 620px; margin: 21px 0 13px; font-size: clamp(30px, 4vw, 46px); line-height: 1.2; letter-spacing: -.5px; }
    .welcome-copy { max-width: 530px; margin-bottom: 25px; color: var(--muted); line-height: 1.8; font-size: 15px; }
    .stat-row { display: flex; flex-wrap: wrap; gap: 9px; margin: 20px 0 25px; }
    .stat { padding: 9px 12px; background: #f8f5fb; border-radius: 10px; font-size: 12px; color: #625c73; }
    .stat b { color: var(--ink); margin-right: 4px; }
    .start-stage {
      isolation: isolate; width: min(820px, 100%); min-height: 520px; padding: 54px clamp(24px, 6vw, 72px);
      display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; text-align: center;
      animation: stage-arrive .7s cubic-bezier(.22, 1, .36, 1) both;
    }
    .start-stage::after {
      content: ""; position: absolute; z-index: -1; width: 430px; height: 430px; border-radius: 50%;
      background: radial-gradient(circle, rgba(247,169,197,.25), rgba(169,221,189,.12) 48%, transparent 70%);
      animation: halo-breathe 4.8s ease-in-out infinite;
    }
    .start-stage > * { position: relative; z-index: 1; }
    .start-orbit {
      width: 96px; height: 96px; margin-bottom: 23px; display: grid; place-items: center;
      border: 1px solid rgba(104,69,197,.18); border-radius: 50%; background: rgba(255,255,255,.72);
      box-shadow: 0 14px 34px rgba(75,45,163,.12); font-size: 42px; animation: orbit-float 3.2s ease-in-out infinite;
    }
    .start-orbit::before, .start-orbit::after { content: ""; position: absolute; border-radius: 50%; border: 1px solid rgba(104,69,197,.14); }
    .start-orbit::before { inset: -12px; }
    .start-orbit::after { inset: -24px; border-style: dashed; animation: orbit-spin 14s linear infinite; }
    .start-stage h1 { max-width: 680px; margin: 19px 0 14px; font-size: 44px; line-height: 1.22; letter-spacing: 0; }
    .start-stage .welcome-copy { margin-inline: auto; margin-bottom: 19px; }
    .start-stage .stat-row { justify-content: center; margin: 13px 0 28px; }
    .start-stage .stat { animation: stat-arrive .55s cubic-bezier(.22, 1, .36, 1) both; }
    .start-stage .stat:nth-child(2) { animation-delay: .08s; }
    .start-stage .stat:nth-child(3) { animation-delay: .16s; }
    .start-button { min-width: 250px; min-height: 52px; font-size: 15px; animation: button-pulse 2.8s ease-in-out infinite; }
    .start-button:hover { animation-play-state: paused; }
    .start-caption { margin: 13px 0 0; color: var(--muted); font-size: 11px; }
    .primary, .secondary, .quiet, .danger {
      min-height: 44px; padding: 0 19px; border-radius: 999px; border: 0; font-weight: 800; cursor: pointer;
      transition: transform .16s ease, box-shadow .16s ease, background .16s ease;
    }
    .primary { color: #fff; background: var(--violet); box-shadow: 0 8px 18px rgba(104,69,197,.23); }
    .primary:hover { transform: translateY(-2px); background: var(--violet-dark); box-shadow: 0 11px 22px rgba(104,69,197,.28); }
    .secondary { background: #fff; border: 1px solid var(--line); }
    .secondary:hover, .quiet:hover { background: #f7f3fb; }
    .quiet { background: transparent; color: var(--violet-dark); padding-inline: 12px; }
    .danger { color: #9c3658; background: var(--pink-pale); }
    .leader-panel { padding: 25px; min-height: 430px; }
    .section-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
    .section-heading h2 { font-size: 20px; margin: 0 0 5px; }
    .section-heading p { color: var(--muted); margin: 0; font-size: 12px; }
    .leader-list { list-style: none; padding: 0; margin: 22px 0 16px; }
    .leader-row { display: grid; grid-template-columns: 31px minmax(0,1fr) auto; align-items: center; gap: 10px; padding: 11px 1px; border-bottom: 1px solid #f0ebf4; }
    .rank { width: 27px; height: 27px; display: grid; place-items: center; border-radius: 9px; background: #f4f0f8; font-size: 12px; font-weight: 900; color: #625574; }
    .rank.top { color: #9b5b13; background: #fff1d9; }
    .leader-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; font-weight: 800; }
    .leader-meta { color: var(--muted); font-size: 11px; margin-top: 3px; }
    .leader-score { font-size: 14px; font-weight: 900; white-space: nowrap; }
    .empty-state { padding: 29px 12px; text-align: center; color: var(--muted); background: #fbf9fd; border-radius: 14px; font-size: 13px; line-height: 1.7; }
    .leader-footer { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .tie-note { color: var(--muted); font-size: 10px; line-height: 1.5; }
    .below-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 22px; }
    .info-band { padding: 20px 23px; display: flex; gap: 14px; align-items: flex-start; }
    .info-icon { width: 37px; height: 37px; flex: 0 0 auto; display: grid; place-items: center; border-radius: 12px; background: var(--mint-pale); font-size: 18px; }
    .info-band h3 { margin: 2px 0 7px; font-size: 14px; }
    .info-band p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.7; }
    .subpage { max-width: 900px; margin: 0 auto; padding: clamp(24px, 5vw, 54px); }
    .subpage h1 { margin: 18px 0 9px; font-size: clamp(27px, 4vw, 38px); line-height: 1.25; }
    .subcopy { color: var(--muted); font-size: 14px; line-height: 1.75; }
    .form-grid { display: grid; gap: 16px; margin-top: 25px; }
    .field { display: grid; gap: 7px; }
    .field label { font-size: 13px; font-weight: 850; }
    .field input { width: 100%; height: 48px; border: 1px solid #ddd6e9; border-radius: 12px; padding: 0 14px; outline: none; background: #fff; color: var(--ink); }
    .field input:focus { border-color: #9c82e7; box-shadow: 0 0 0 3px rgba(104,69,197,.11); }
    .field input::placeholder { color: #aaa5b3; }
    .privacy-box { margin-top: 3px; padding: 13px 15px; border-radius: 12px; color: #625977; background: #f4efff; font-size: 11px; line-height: 1.7; }
    .form-actions { display: flex; gap: 10px; margin-top: 3px; }
    .quiz-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 23px; }
    .quiz-top .secondary { min-height: 40px; }
    .quiz-meta { display: flex; align-items: center; gap: 9px; }
    .score-chip { padding: 9px 13px; border-radius: 999px; background: white; font-size: 12px; font-weight: 800; }
    .progress { display: grid; grid-template-columns: repeat(20, 1fr); gap: 5px; margin: 18px 0 25px; }
    .progress span { height: 9px; border-radius: 999px; background: rgba(255,255,255,.92); }
    .progress span.done { background: #84cea1; }
    .progress span.current { background: #fff; outline: 2px solid var(--violet); outline-offset: 1px; }
    .question-card { padding: clamp(23px, 4vw, 38px); }
    .question-kicker { color: var(--muted); font-family: Georgia, serif; font-size: 16px; margin-bottom: 14px; }
    .question-kicker b { color: var(--violet); font-family: "Malgun Gothic", sans-serif; }
    .question-title { font-size: clamp(21px, 3vw, 29px); line-height: 1.5; margin: 0 0 24px; }
    .choice-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; }
    .choice {
      min-height: 95px; display: grid; grid-template-columns: 38px minmax(0,1fr); align-items: center; gap: 13px;
      padding: 17px; border: 1.5px solid transparent; border-radius: 17px; text-align: left; cursor: pointer;
      font-size: 14px; line-height: 1.65; transition: transform .14s ease, box-shadow .14s ease;
    }
    .choice:nth-child(4n+1) { background: #fff0f5; border-color: #f5bfd1; }
    .choice:nth-child(4n+2) { background: #fff5e8; border-color: #f5d09c; }
    .choice:nth-child(4n+3) { background: #eff9f1; border-color: #b7dfc2; }
    .choice:nth-child(4n) { background: #f0f6ff; border-color: #c1d5f8; }
    .choice:hover { transform: translateY(-2px); box-shadow: 0 7px 15px rgba(54,44,80,.08); }
    .choice.selected { outline: 3px solid var(--violet); outline-offset: 1px; }
    .choice.correct { background: #e5f7e9; border-color: #6bb782; }
    .choice.wrong { background: #fff0f0; border-color: #e39393; }
    .choice-number { width: 33px; height: 33px; display: grid; place-items: center; border-radius: 50%; background: white; font-weight: 900; }
    .question-controls { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 23px; }
    .question-controls .right { display: flex; align-items: center; gap: 9px; }
    .question-controls button:disabled { opacity: .42; cursor: not-allowed; box-shadow: none; }
    .answer-note { margin: 15px 0 0; padding: 12px 14px; border-radius: 11px; background: #f6f3fb; color: #615a72; font-size: 12px; line-height: 1.7; }
    .result-head { text-align: center; padding-bottom: 24px; border-bottom: 1px solid var(--line); }
    .result-medal { font-size: 42px; margin-bottom: 7px; }
    .result-head h1 { margin: 0 0 8px; font-size: 30px; }
    .result-score { color: var(--violet); font-size: 30px; font-weight: 900; margin: 15px 0 4px; }
    .result-detail { color: var(--muted); font-size: 12px; line-height: 1.7; }
    .result-actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 9px; margin: 22px 0 30px; }
    .review-title { font-size: 17px; margin-bottom: 11px; }
    .review-item { padding: 14px 0; border-top: 1px solid #f0ebf4; }
    .review-item summary { cursor: pointer; font-size: 13px; line-height: 1.65; font-weight: 800; }
    .answer-feedback { display: grid; gap: 9px; margin: 12px 0; }
    .answer-status { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 900; }
    .answer-status-icon { width: 28px; height: 28px; display: grid; place-items: center; flex: 0 0 auto; border-radius: 50%; background: white; font-size: 17px; }
    .answer-correct { padding: 12px 14px; border: 1px solid #a8d7b4; border-radius: 12px; background: #edf8f0; color: #245d35; }
    .answer-wrong { padding: 12px 14px; border: 1px solid #efb4b4; border-radius: 12px; background: #fff1f1; color: #873941; }
    .answer-preview { padding: 12px 14px; border: 1px solid #c8b9ef; border-radius: 12px; background: #f7f3ff; color: #51399b; }
    .answer-pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
    .answer-choice { min-width: 0; padding: 11px 12px; border-radius: 10px; background: rgba(255,255,255,.82); font-size: 12px; line-height: 1.65; overflow-wrap: anywhere; }
    .answer-choice-label { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; font-size: 11px; font-weight: 900; }
    .answer-choice.is-wrong { border: 1px solid #e7a5a5; }
    .answer-choice.is-correct { border: 1px solid #91c9a0; }
    .answer-choice.is-selected { border: 1px solid #b7a3e8; }
    .explanation-box { margin: 10px 0; padding: 12px 14px; border-left: 3px solid var(--violet); border-radius: 0 10px 10px 0; background: #f7f4fc; color: #514968; font-size: 12px; line-height: 1.75; }
    .explanation-title { display: block; margin-bottom: 4px; color: var(--violet-dark); font-size: 11px; font-weight: 900; }
    .review-item a, .source-link { color: var(--violet-dark); font-size: 11px; font-weight: 750; }
    .leader-title-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
    .leader-title-row h1 { margin: 14px 0 5px; }
    .leader-table { width: 100%; border-collapse: collapse; }
    .leader-table th { padding: 12px; text-align: left; color: var(--muted); background: #faf8fc; font-size: 11px; }
    .leader-table th:first-child { border-radius: 10px 0 0 10px; }
    .leader-table th:last-child { border-radius: 0 10px 10px 0; text-align: right; }
    .leader-table td { padding: 14px 12px; border-bottom: 1px solid #f0ebf4; font-size: 13px; }
    .leader-table td:last-child { text-align: right; font-weight: 900; }
    .leader-table .rank-cell { width: 48px; font-weight: 900; color: var(--violet-dark); }
    .empty-wide { padding: 40px 10px; text-align: center; color: var(--muted); }
    .error-text { margin: 12px 0; color: #a23550; font-size: 12px; line-height: 1.65; }
    footer { padding: 23px 10px; text-align: center; color: #817a8c; font-size: 10px; line-height: 1.7; }
    @keyframes stage-arrive { from { opacity: 0; transform: translateY(24px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes halo-breathe { 0%, 100% { transform: scale(.9); opacity: .6; } 50% { transform: scale(1.08); opacity: 1; } }
    @keyframes orbit-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
    @keyframes orbit-spin { to { transform: rotate(360deg); } }
    @keyframes stat-arrive { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes button-pulse { 0%, 100% { box-shadow: 0 8px 18px rgba(104,69,197,.23); } 50% { box-shadow: 0 12px 30px rgba(104,69,197,.38); } }
    @media (max-width: 760px) {
      .topbar { padding: 12px 16px; align-items: flex-start; flex-direction: column; gap: 10px; }
      .nav { width: 100%; overflow-x: auto; }
      .nav button { white-space: nowrap; padding: 9px 11px; }
      .page { margin-top: 22px; }
      .plaza-grid, .below-grid { grid-template-columns: 1fr; }
      .welcome, .leader-panel { min-height: auto; }
      .welcome { padding-bottom: 110px; }
      .welcome::after { right: 20px; bottom: 10px; font-size: 86px; }
      .choice-grid { grid-template-columns: 1fr; }
      .choice { min-height: 75px; }
      .quiz-top { align-items: flex-start; }
      .leader-title-row { align-items: flex-start; flex-direction: column; }
      .leader-table th, .leader-table td { padding: 11px 7px; }
      .local-note { font-size: 11px; }
      .answer-pair { grid-template-columns: 1fr; }
      .page.home-mode { min-height: calc(100vh - 174px); padding-block: 22px; }
      .start-stage { min-height: 500px; padding: 42px 22px; }
      .start-stage h1 { font-size: 32px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; } }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand" aria-label="Quiz 마을">
      <div class="brand-mark" aria-hidden="true">🏡</div>
      <div><div class="brand-name">Quiz 마을</div><div class="brand-caption">M365 Copilot · Agent Builder Pop Quiz</div></div>

    <nav class="nav" aria-label="주 메뉴">

  </header>
  <main class="page" id="app" aria-live="polite"></main>

  <script>
    const SUPABASE_CONFIG = {

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[char]));
    }
    function orderedScores() {
      return [...state.scores].sort((a, b) => b.score - a.score || Date.parse(a.submitted_at) - Date.parse(b.submitted_at) || String(a.id ?? "").localeCompare(String(b.id ?? "")));
    }
    function formatDate(timestamp) {
      return new Intl.DateTimeFormat("ko-KR", { dateStyle: "short", timeStyle: "short" }).format(new Date(timestamp));
    }
    function localNotice() {
      if (LOCAL_API_PREVIEW) return `<div class="local-note"><strong>로컬 채점 서버</strong><span>점수와 정답 판정은 로컬 서버에서 계산합니다. 참가 정보와 기록은 현재 서버 프로세스 메모리에만 있으며 서버를 종료하면 삭제됩니다.</span></div>`;
      if (SUPABASE_READY) return "";
      if (LOCAL_PREVIEW) return `<div class="local-note"><strong>파일 미리보기</strong><span>직접 파일을 열면 입력 내용은 저장되지 않으며 점수·정답 판정도 하지 않습니다. 전체 결과를 확인하려면 로컬 Node 서버로 실행해 주세요. 실제 개인정보는 입력하지 마세요.</span></div>`;
      return `<div class="local-note"><strong>서비스 준비 중</strong><span>공용 저장소 연결이 완료되지 않아 참가 정보를 받지 않습니다. Supabase 설정 후 퀴즈를 열 수 있습니다.</span></div>`;
    }
    async function callFunction(name, method = "POST", body = undefined) {
      const baseUrl = LOCAL_API_PREVIEW ? location.origin : SUPABASE_CONFIG.url.replace(/\/$/, "");
      const authHeaders = LOCAL_API_PREVIEW ? {} : { apikey: SUPABASE_CONFIG.publishableKey, Authorization: `Bearer ${SUPABASE_CONFIG.publishableKey}` };
      const response = await fetch(`${baseUrl}/functions/v1/${name}`, {
        method,
        headers: { ...authHeaders, ...(body ? { "Content-Type": "application/json" } : {}) },
        ...(body ? { body: JSON.stringify(body) } : {})
      });
      const payload = await response.json();
      if (!response.ok) throw new Error(payload.error || "request_failed");
      return payload;
    }
    function userMessage(error) {
      const messages = {
        event_closed: "행사 참여 기간이 종료되었습니다.",
        already_submitted: "이미 제출한 퀴즈입니다.",
        quiz_scoring_not_configured: "퀴즈 채점 설정이 준비되지 않았습니다.",
        leaderboard_unavailable: "리더보드를 불러오지 못했습니다.",
        request_failed: "요청을 처리하지 못했습니다. 잠시 후 다시 시도해 주세요."
      };
      return messages[error.message] || messages.request_failed;
    }
    async function refreshLeaderboard() {

      state.leaderboardLoading = true;

    }

      if (state.view === "quiz") return renderQuiz();

      if (state.view === "leaderboard") return renderLeaderboard();
      return renderPlaza();

    function scoreRows(scores, limit) {

          <h1>준비되셨나요?<br>퀴즈에 도전해 보세요!</h1>
          <p class="welcome-copy">M365 Copilot과 Agent Builder 핵심 개념을 20문항으로 확인하고, 모든 문제를 완료한 뒤 점수와 퀴즈 리더보드를 확인하세요.</p>
          <div class="stat-row"><span class="stat"><b>20</b>문항</span><span class="stat"><b>12</b>기초 · 각 20점</span><span class="stat"><b>8</b>응용·심화 · 80~140점</span></div>
          <button type="button" class="primary start-button" data-action="start" ${QUIZ_API_READY || LOCAL_PREVIEW ? "" : "disabled"}>${QUIZ_API_READY || LOCAL_PREVIEW ? "퀴즈 시작하기 →" : "저장소 연결 후 시작 가능"}</button>
          <p class="start-caption">문제를 모두 완료하면 정답 해설과 퀴즈 리더보드가 열립니다.</p>
        </section>`;
    }
    function renderAdmission() {
      const canStart = QUIZ_API_READY || LOCAL_PREVIEW;
      app.innerHTML = `${localNotice()}<section class="panel panel-rainbow subpage">
        <span class="eyebrow">대강당 입장</span><h1>퀴즈를 풀기 전에<br>이름표를 만들어 주세요!</h1>
        <p class="subcopy">20문항 · 기초 12문항 + 응용·심화 8문항 · 만점 1,000점</p>
        <form id="admission-form" class="form-grid">
          <div class="field"><label for="name">이름</label><input id="name" name="name" required maxlength="60" autocomplete="name" placeholder="예) 김민지" ${canStart ? "" : "disabled"}></div>
          <div class="field"><label for="department">부서</label><input id="department" name="department" required maxlength="80" autocomplete="organization" placeholder="예) AI 비즈니스 솔루션팀" ${canStart ? "" : "disabled"}></div>
          <div class="privacy-box">리더보드에는 성명이 전체 공개되고 부서는 공개되지 않습니다. 실제 운영 시 이름·부서는 점수와 분리해 보관하며, 행사 종료 후 설정된 보관 기간(기본 7일)이 지나면 함께 삭제합니다. 로컬 미리보기에서는 입력값을 저장하지 않습니다.</div>
          <div class="form-actions"><button type="button" class="secondary" data-action="plaza">돌아가기</button><button type="submit" class="primary" ${canStart ? "" : "disabled"}>${canStart ? "퀴즈 시작하기 →" : "저장소 연결 후 시작 가능"}</button></div>
        </form></section>`;
    }
    async function startQuiz(event) {
      event.preventDefault();
      const formElement = event.target;
      const form = new FormData(formElement);
      const name = String(form.get("name")).trim();
      const department = String(form.get("department")).trim();
      if (!name || !department) return;
      const submitButton = formElement.querySelector("[type=submit]");
      submitButton.disabled = true;
      state.errorMessage = "";
      try {
        const participant = QUIZ_API_READY ? await callFunction("start-quiz", "POST", { name, department }) : { participant_id: "local-preview", started_at: new Date().toISOString() };
        state.player = { id: participant.participant_id, name, department };
        state.answers = Array(questions.length).fill(null);
        state.optionOrder = questions.map(() => [0, 1, 2, 3].sort(() => Math.random() - 0.5));
        state.current = 0;
        state.startedAt = participant.started_at;
        state.view = "quiz";
        render();
      } catch (error) {
        state.errorMessage = userMessage(error);
        renderAdmission();
      }
    }
    function renderQuiz() {
      const index = state.current, item = questions[index], selected = state.answers[index];
      const progress = questions.map((_, i) => `<span class="${i < index ? "done" : i === index ? "current" : ""}"></span>`).join("");
      const choices = state.optionOrder[index].map((optionIndex, displayIndex) => `<button type="button" class="choice ${selected === optionIndex ? "selected" : ""}" data-answer="${optionIndex}" aria-pressed="${selected === optionIndex}"><span class="choice-number">${displayIndex + 1}</span><span>${escapeHTML(item.options[optionIndex])}</span></button>`).join("");
      const answeredCount = state.answers.filter(answer => answer !== null).length;
      app.innerHTML = `${localNotice()}${state.errorMessage ? `<p class="error-text">${escapeHTML(state.errorMessage)}</p>` : ""}<div class="quiz-top"><button class="secondary" type="button" data-action="quit">← 마을로 돌아가기</button><div class="quiz-meta"><span class="tag">${item.level} · ${item.points}점</span><span class="score-chip">${escapeHTML(state.player.name)} · ${answeredCount}/${questions.length} 답변</span></div></div>
        <div class="progress" aria-label="${index + 1} / ${questions.length} 진행">${progress}</div>
        <section class="panel panel-rainbow question-card"><div class="question-kicker"><b>Q${String(index + 1).padStart(2, "0")}</b> / Q${questions.length}</div><h1 class="question-title">${escapeHTML(item.q)}</h1>
        <div class="choice-grid">${choices}</div>
        <div class="question-controls"><button type="button" class="quiet" data-action="previous" ${index === 0 ? "disabled" : ""}>← 이전 문제</button><div class="right"><span class="tie-note">${selected === null ? "답을 선택해 주세요" : "답변이 저장되었습니다"}</span><button type="button" class="primary" data-action="next" ${selected === null || state.submitting ? "disabled" : ""}>${index === questions.length - 1 ? "제출하고 결과 보기" : "다음 문제 →"}</button></div></div></section>`;
      app.querySelectorAll("[data-answer]").forEach(button => button.addEventListener("click", () => { state.answers[index] = Number(button.dataset.answer); renderQuiz(); }));
    }
    async function submitQuiz() {
      if (!QUIZ_API_READY) {
        state.latestScore = {
          preview: true,
          name: state.player.name,
          submitted_at: new Date().toISOString(),
          duration_ms: Math.max(0, Date.now() - Date.parse(state.startedAt))
        };
        state.errorMessage = "";
        state.view = "result";
        render();
        return;
      }
      state.submitting = true;
      state.errorMessage = "";
      renderQuiz();
      try {
        const result = await callFunction("submit-quiz", "POST", { participantId: state.player.id, answers: state.answers });
        state.latestScore = { ...result, name: state.player.name, rank: 0 };
        try {
          state.scores = await callFunction("leaderboard", "GET");
          const entry = state.scores.find(row => row.name === state.player.name && row.score === result.score && row.submitted_at === result.submitted_at);
          if (entry) state.latestScore.rank = entry.rank;
        } catch { state.scores = []; }
        state.view = "result";
      } catch (error) {
        state.errorMessage = userMessage(error);
      } finally {
        state.submitting = false;
        render();
      }
    }
    function renderResult() {
      const result = state.latestScore;
      const review = questions.map((item, index) => {
        const selectedAnswer = state.answers[index];
        const correct = result.preview ? null : result.correctness[index];
        const correctIndex = result.preview ? null : result.correct_answers[index];
        const answerFeedback = result.preview
          ? `<div class="answer-feedback"><div class="answer-status answer-preview"><span class="answer-status-icon" aria-hidden="true">📝</span><span>미리보기 답변</span></div><div class="answer-choice is-selected">${selectedAnswer === null ? "응답하지 않았습니다." : escapeHTML(item.options[selectedAnswer])}</div></div>`
          : correct
            ? `<div class="answer-feedback"><div class="answer-status answer-correct"><span class="answer-status-icon" aria-hidden="true">✓</span><span>정답이에요!</span></div><div class="answer-choice is-correct"><span class="answer-choice-label">✓ 정답</span>${escapeHTML(item.options[correctIndex])}</div></div>`
            : `<div class="answer-feedback"><div class="answer-status answer-wrong"><span class="answer-status-icon" aria-hidden="true">✕</span><span>아쉬워요, 다시 확인해 보세요.</span></div><div class="answer-pair"><div class="answer-choice is-wrong"><span class="answer-choice-label">✕ 내 답</span>${escapeHTML(item.options[selectedAnswer])}</div><div class="answer-choice is-correct"><span class="answer-choice-label">✓ 정답</span>${escapeHTML(item.options[correctIndex])}</div></div></div>`;
        const pptReference = item.pptSlide ? ` · 교안 ${item.pptSlide}장` : "";
        const icon = result.preview ? selectedAnswer === null ? "▫️" : "📝" : correct ? "✅" : "▫️";
        const points = result.preview ? "" : `${item.points}점 · `;
        return `<details class="review-item ${correct === null ? "" : correct ? "is-correct" : "is-incorrect"}"><summary>${icon} Q${String(index + 1).padStart(2, "0")} · ${points}${escapeHTML(item.q)}</summary>${answerFeedback}<div class="explanation-box"><span class="explanation-title">정답 해설</span>${escapeHTML(item.explain)}</div><a href="${sources[item.source].url}" target="_blank" rel="noreferrer">Microsoft Learn: ${escapeHTML(sources[item.source].title)} ↗</a><span class="tie-note">${pptReference}</span></details>`;
      }).join("");
      const rankText = result.rank ? `현재 ${result.rank}위` : "리더보드에서 순위를 확인해 주세요";
      const resultSummary = result.preview
        ? `${questions.length}문항 풀이 완료 · 로컬 미리보기에서는 점수와 정답 판정을 하지 않습니다.`
        : `${result.correct_count} / ${questions.length} 정답 · ${rankText}<br>${formatDate(result.submitted_at)} 제출 · 소요 ${Math.floor(result.duration_ms / 60000)}분 ${Math.floor(result.duration_ms / 1000) % 60}초`;
      const resultActions = result.preview
        ? `<button type="button" class="primary" data-action="plaza">마을 광장으로</button>`
        : `<button type="button" class="primary" data-action="leaderboard">퀴즈 리더보드 보기</button><button type="button" class="secondary" data-action="plaza">퀴즈 홈으로</button>`;
      app.innerHTML = `${localNotice()}<section class="panel panel-rainbow subpage"><div class="result-head"><div class="result-medal">${!result.preview && result.rank === 1 ? "🏆" : "🎉"}</div><span class="eyebrow">${result.preview ? "미리보기 완료" : "퀴즈 제출 완료"}</span><h1>${escapeHTML(result.name)}님, 수고했어요!</h1><div class="result-score">${result.preview ? "완료" : `${result.score}점`}</div><div class="result-detail">${resultSummary}</div></div>
        <div class="result-actions">${resultActions}</div><h2 class="review-title">문항별 답변과 해설 및 Microsoft Learn 근거</h2>${review}</section>`;
    }
    function renderLeaderboard() {
      const scores = orderedScores();
      app.innerHTML = `${localNotice()}${state.errorMessage ? `<p class="error-text">${escapeHTML(state.errorMessage)}</p>` : ""}<section class="panel panel-rainbow subpage"><div class="leader-title-row"><div><span class="eyebrow">🏆 Quiz Ranking</span><h1>퀴즈 리더보드</h1><p class="subcopy">이름은 전체 표시 · 점수 내림차순 · 서버 제출 시각순</p></div><button type="button" class="secondary" data-action="plaza">← 퀴즈 홈</button></div>${scores.length ? `<div style="overflow-x:auto"><table class="leader-table"><thead><tr><th>순위</th><th>이름</th><th>제출 시각</th><th>점수</th></tr></thead><tbody>${scores.map((row, index) => `<tr><td class="rank-cell">${row.rank ?? index + 1}</td><td><strong>${escapeHTML(row.name)}</strong></td><td>${formatDate(row.submitted_at)}</td><td>${row.score}점</td></tr>`).join("")}</tbody></table></div>` : `<div class="empty-wide">${state.leaderboardLoading ? "퀴즈 리더보드를 불러오는 중입니다…" : "아직 제출된 기록이 없습니다."}</div>`}<div class="leader-footer" style="margin-top:20px"><span class="tie-note">전체 ${scores.length}건</span></div></section>`;
    }
    document.querySelectorAll(".nav [data-view]").forEach(button => button.addEventListener("click", () => {
      state.view = button.dataset.view; state.errorMessage = ""; render(); window.scrollTo({ top: 0, behavior: "smooth" });
      if (QUIZ_API_READY && Date.now() - state.leaderboardLoadedAt > 15000) refreshLeaderboard();
    }));
    app.addEventListener("submit", event => { if (event.target.id === "admission-form") startQuiz(event); });
    app.addEventListener("click", event => {
      const button = event.target.closest("[data-action]");
      if (!button) return;
      switch (button.dataset.action) {
        case "start": state.view = "admission"; break;
        case "plaza": state.view = "plaza"; break;
        case "leaderboard": if (!state.latestScore || state.latestScore.preview) return; state.view = "leaderboard"; if (QUIZ_API_READY && Date.now() - state.leaderboardLoadedAt > 15000) refreshLeaderboard(); break;
        case "previous": if (state.current > 0) state.current--; break;
        case "next": if (state.answers[state.current] === null) return; if (state.current < questions.length - 1) state.current++; else return submitQuiz(); break;
        case "quit": if (confirm("퀴즈를 그만두고 마을로 돌아갈까요? 지금까지의 답은 점수에 반영되지 않습니다.")) state.view = "plaza"; break;
      }
      render(); window.scrollTo({ top: 0, behavior: "smooth" });
    });
    render();
  </script>
</body>
</html>
